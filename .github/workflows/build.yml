name: 🛠 Linux/MacOS CI / Build & Release Binary

on:
  push:
    branches: [ main, master, upgrade ]
    tags:    [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, upgrade ]

permissions:
  contents: write   # allow creating/updating Releases & uploading assets
  actions:  read    # allow pulling marketplace actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  build_and_release_linux:
    name: linux (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One runner failing should not hide the results from the others -
      # ubuntu-26.04 is a preview image and can break independently of us.
      fail-fast: false
      matrix:
        # include rather than a bare os list because arm64 needs a different
        # Flutter install and lands its bundle under a different path. label is
        # what artifacts are named after: matrix.os alone would give the arm
        # entry the redundant name ubuntu-24.04-arm-arm64.
        include:
          - { os: ubuntu-24.04,     arch: x64,   label: ubuntu-24.04-x64 }
          - { os: ubuntu-26.04,     arch: x64,   label: ubuntu-26.04-x64 }
          - { os: ubuntu-24.04-arm, arch: arm64, label: ubuntu-24.04-arm64 }
 
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6
 
      - name: 🚀 Cache pub deps
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          # Keyed on label, not os, so the two architectures never share a
          # cache - ffigen and the native asset pipeline put arch-specific
          # build output in here.
          key: ${{ matrix.label }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ matrix.label }}-pub-
 
      # ── Flutter, two ways ─────────────────────────────────────────────────
      # Flutter publishes no linux-arm64 SDK tarball, only x64, so
      # subosito/flutter-action cannot resolve any version on an arm runner and
      # fails with "Unable to determine Flutter version for channel: stable".
      # See subosito/flutter-action#345. Cross-building is not an escape hatch
      # either - flutter build linux --target-platform=linux-arm64 refuses on an
      # x64 host (flutter/flutter#148439). So arm64 clones the SDK from git,
      # which is supported as a host (flutter/flutter#61221); update_dart_sdk.sh
      # detects aarch64 and fetches the arm64 Dart SDK by itself.
      - name: 🦋 Setup Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
 
      - name: 🚀 Cache Flutter SDK (arm64)
        if: matrix.arch == 'arm64'
        uses: actions/cache@v5
        with:
          path: ~/flutter
          key: ${{ matrix.label }}-flutter-${{ env.FLUTTER_VERSION }}
 
      - name: 🦋 Setup Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          # A half-restored cache is worse than none - re-clone unless the
          # entrypoint is actually there and executable.
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            rm -rf "$HOME/flutter"
            git clone --depth 1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$HOME/flutter"
          fi
          # The SDK is a git checkout and the tool shells out to git against it;
          # a cache restore can leave it owned differently than the runner user,
          # which git refuses to touch without this.
          git config --global --add safe.directory "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
 
      - name: 🦋 Prime Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          flutter --version
          flutter config --enable-linux-desktop
          # If the linux-arm64 engine artifacts were ever to go missing, this
          # is the step that would say so, rather than a confusing failure
          # deep in the CMake build later on.
          flutter precache --linux
 
      - name: Get os dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang
          sudo apt-get install -y cmake
          sudo apt-get install -y ninja-build
          sudo apt-get install -y pkg-config
          sudo apt-get install -y libgtk-3-dev
          # g++ pulls whichever libstdc++ headers this release defaults to,
          # which clang then finds. The pinned version below does not exist on
          # every ubuntu, so it is best effort on top.
          sudo apt-get install -y g++
          sudo apt-get install -y libstdc++-12-dev || true
          sudo apt-get install -y --no-install-recommends libboost-dev
 
      - name: Compile libslink
        run: |
          cd third_party/libslink
          CC=clang make shared
 
      - name: Compile libmseed
        run: |
          cd third_party/libmseed
          CC=clang make shared
 
      - name: 📥 Get dependencies
        run: flutter pub get
 
      #- name: ✅ Run tests
      #  run: flutter test --coverage
 
      - name: ✅ Run tests
        run: |
          dart run ffigen --config ffigen.yaml
          # Everything except the tests tagged live, which need a SEEDLink
          # server on localhost:18000. Naming the tag rather than listing files
          # means new test files are covered without editing this step.
          flutter test --exclude-tags live
 
      - name: Build Linux
        run: |
          dart run ffigen --config ffigen.yaml
          flutter build linux --release
 
      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          # flutter build names the output directory after the target arch, so
          # this doubles as a check that the arm runner really did produce an
          # arm64 build rather than silently falling back to x64.
          out="build/linux/${{ matrix.arch }}/release"
          test -d "$out/bundle"
          # The executable cannot run on its own - it needs the sibling lib/
          # and data/ directories - so ship the whole bundle as one archive.
          # Rename the bundle first so the archive has a seedlink_viewer/ root
          # and unpacks into one directory instead of scattering lib/, data/
          # and the executable across the current directory.
          mv "$out/bundle" "$out/seedlink_viewer"
          tar -czf artifacts/seedlink_viewer-${{ matrix.label }}.tar.gz \
            -C "$out" seedlink_viewer
 
      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v7
        with:
          name: seedlink_viewer-${{ matrix.label }}
          path: artifacts/seedlink_viewer-${{ matrix.label }}.tar.gz
          # Upload the tarball as-is. The default wraps whatever it is given in
          # a zip, which would mean unzipping to get at the .tar.gz. Only a
          # single file may be uploaded when this is false.
          archive: false
 
  build_and_release_macos:
    name: macos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both of these are arm64 runners, which is what we ship
        os: [macos-15, macos-26]

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🚀 Cache pub deps
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ matrix.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ matrix.os }}-pub-

      - name: Get os dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install boost

      # No step is needed to point the build at Boost. Build hooks run with a
      # sanitised environment (only HOME, PATH and GOPATH survive), so exporting
      # BOOST_INCLUDEDIR here would never reach hook/build.dart. The hook asks
      # brew for the prefix itself - see findBoostIncludeDirectory.

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.0, channel: stable } 

      # Both libraries are linked with extra Mach-O header space. Flutter's
      # native asset pipeline rewrites the install name and rpath of these
      # dylibs when it bundles them into the .app, and a Mach-O can only be
      # rewritten in place if the header has room for the longer load command.
      # Without the padding install_name_tool refuses with "larger updated load
      # commands do not fit (the program must be relinked)".
      - name: Compile libslink
        env:
          LDFLAGS: -Wl,-headerpad_max_install_names
        run: |
          cd third_party/libslink
          CC=clang make shared

      - name: Compile libmseed
        env:
          LDFLAGS: -Wl,-headerpad_max_install_names
        run: |
          cd third_party/libmseed
          CC=clang make shared

      - name: Fix libs
        run: |
          cd third_party
          install_name_tool -id @rpath/libslink.dylib  libslink/libslink.4.2.0.dylib
          install_name_tool -id @rpath/libmseed.dylib  libmseed/libmseed.3.4.1.dylib
          codesign --force --sign - libslink/libslink.4.2.0.dylib
          codesign --force --sign - libmseed/libmseed.3.4.1.dylib

      - name: 📥 Get dependencies
        run: flutter pub get

      #- name: otool some stuff
      #  run: |
      #    otool -D third_party/libslink/libslink.dylib
      #    otool -D third_party/libmseed/libmseed.dylib
      #    otool -L third_party/libslink/libslink.4.2.0.dylib

      - name: ✅ Run tests
        run: |
          dart run ffigen --config ffigen.yaml
          # As on linux - everything but the tests needing a live server
          flutter test --exclude-tags live

      - name: Build MacOS
        run: |
          dart run ffigen --config ffigen.yaml
          flutter build macos --release

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
          # ditto rather than zip: a .app is a directory whose symlinks, and
          # the executable bit the code signature covers, have to survive.
          ditto -c -k --keepParent "$app" \
            artifacts/seedlink_viewer-${{ matrix.os }}-arm64.zip

      - name: Upload MacOS ARM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: seedlink_viewer-${{ matrix.os }}-arm64
          path: artifacts/seedlink_viewer-${{ matrix.os }}-arm64.zip
          # As on linux - upload the archive as-is rather than zipping the zip
          archive: false


  # ─────────────── ONLY ON TAGS ───────────────
  # A single release job rather than one per build. Four matrix jobs all
  # calling the release action would race to create the same release on a tag
  # push - allowUpdates covers the update, but not two jobs both finding no
  # release and both trying to create it.
  release:
    name: release
    needs: [build_and_release_linux, build_and_release_macos]
    # Publish whatever built. A matrix job fails as a whole if any entry fails,
    # so without this a flaky runner - or the preview ubuntu image - would hold
    # back the platforms that did build.
    #
    # !cancelled() rather than always(): always() also fires for a cancelled
    # run, and with cancel-in-progress set a superseded tag push would publish.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Collect every build
        uses: actions/download-artifact@v7
        with:
          # No name, so everything this run produced
          path: dist

      - name: 📋 Check what built
        run: |
          # download-artifact leaves no directory at all when there is nothing
          # to fetch, and steps run under bash -e, so find would abort the step
          # before the check below could report anything useful.
          mkdir -p dist
          found=$(find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          echo "$found"
          # Releasing nothing at all is worse than not releasing
          if [ -z "$found" ]; then
            echo "::error::Every build failed - refusing to publish an empty release"
            exit 1
          fi
          # A partial release is allowed, but it should never be a surprise
          missing=""
          for expected in ubuntu-24.04-x64 ubuntu-26.04-x64 \
                          macos-15-arm64 macos-26-arm64; do
            echo "$found" | grep -q "$expected" || missing="$missing $expected"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Publishing a partial release - no build for:$missing"
          fi

      - name: 🏷️ Create or update Release
        uses: ncipollo/release-action@v1
        with:
          tag:       ${{ github.ref_name }}
          name:      Release ${{ github.ref_name }}
          # Globbed because download-artifact nests each artifact in a
          # directory of its own name.
          artifacts: "dist/**/*.tar.gz,dist/**/*.zip"
          allowUpdates: true
          token:     ${{ secrets.GITHUB_TOKEN }}

